<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f0de">
    <meta name="description" content="Portfolio de Rafael Osuna Ventura, técnico superior en ASIR y estudiante de Ingeniería Informática. Software, sistemas y ciberseguridad.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Rafael Osuna Ventura · Portfolio">
    <meta property="og:description" content="Proyectos y trayectoria en software, sistemas y ciberseguridad.">
    <meta property="og:url" content="https://rafaosunaa.github.io/">
    <meta property="og:image" content="https://rafaosunaa.github.io/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="es_ES">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://rafaosunaa.github.io/">
    <link rel="icon" href="/mark.svg" type="image/svg+xml">
    <title>Rafael Osuna Ventura · Portfolio</title>
    <style>
      .intro {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        visibility: hidden;
        pointer-events: none;
        --intro-y: 44%;
      }
      html[data-preloading] .intro { visibility: visible; pointer-events: auto; }
      html[data-preloading] .site-header .brand { opacity: 0; }
      .intro-sheet { position: absolute; inset: 0; background: #f8f0de; }
      .intro-sheet[data-burst] {
        --intro-opening: 0px;
        mask-image: radial-gradient(circle at 50% var(--intro-y), transparent calc(var(--intro-opening) - 2px), #000 var(--intro-opening));
      }
      .intro-canvas { position: absolute; display: block; }
      .intro-seed {
        position: absolute;
        top: var(--intro-y);
        left: 50%;
        width: .72rem;
        height: .72rem;
        margin: -.36rem 0 0 -.36rem;
        border-radius: 50%;
        background: #174478;
        animation: intro-seed .9s ease-in-out infinite alternate;
      }
      .intro[data-mode] .intro-seed { display: none; }
      @keyframes intro-seed { from { scale: .65; opacity: .48; } to { scale: 1.16; opacity: 1; } }
      .intro-brand-slot {
        position: absolute;
        top: var(--intro-y);
        inset-inline: 0;
        display: flex;
        justify-content: center;
        transform: translateY(-50%);
      }
      .intro-brand { position: relative; width: clamp(8rem, 28vmin, 18rem); opacity: 0; }
      .intro[data-mode="fallback"] .intro-brand { opacity: 1; }
      .intro-brand img { display: block; width: 100%; height: auto; }
      .intro-fragments, .intro-fragment { position: absolute; inset: 0; }
      .intro-fragments { visibility: hidden; }
      .intro-fragment { background-size: 100% 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:40rem;margin:3rem auto;padding:0 1.25rem;font:1rem/1.6 system-ui,sans-serif;color:#174478">
        <h1>Rafael Osuna Ventura</h1>
        <p>Técnico Superior en ASIR y estudiante de Ingeniería Informática. Software · Sistemas · Ciberseguridad.</p>
        <p><a href="mailto:rafaelosunaventura@gmail.com">rafaelosunaventura@gmail.com</a> ·
          <a href="https://github.com/rafaosunaa">GitHub</a> ·
          <a href="https://www.linkedin.com/in/rafael-osuna-ventura/">LinkedIn</a> ·
          <a href="/rafael-osuna-ventura-cv.pdf">Descargar CV</a></p>
        <p>Esta web necesita JavaScript para mostrar el portfolio completo.</p>
      </div>
    </noscript>
    <div class="intro" aria-hidden="true">
      <div class="intro-sheet"></div>
      <div class="intro-seed"></div>
      <div class="intro-brand-slot">
        <div class="intro-brand"><img src="/logo-inflated.webp" width="600" height="290" alt="ro." fetchpriority="high"></div>
      </div>
    </div>
    <script>
      (function () {
        var seen = false;
        try { seen = sessionStorage.getItem('intro-seen') === '1'; } catch (e) {}
        var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if ((location.hash && location.hash !== '#inicio') || seen || calm) return;
        var page = document.documentElement;
        var app = document.getElementById('root');
        document.querySelector('.intro').dataset.started = String(performance.now());
        var skip = function () { document.dispatchEvent(new Event('portfolio:preloaded')); };
        var deadline = window.setTimeout(skip, 6900);
        document.addEventListener('portfolio:preloaded', function () {
          window.clearTimeout(deadline);
          window.removeEventListener('pointerdown', skip);
          window.removeEventListener('keydown', skip);
          try { sessionStorage.setItem('intro-seen', '1'); } catch (e) {}
          page.removeAttribute('data-preloading');
          app.inert = false;
        }, { once: true });
        // Un clic, un toque o una tecla saltan la introducción.
        window.addEventListener('pointerdown', skip);
        window.addEventListener('keydown', skip);
        page.setAttribute('data-preloading', '');
        app.inert = true;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
