<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f0de">
    <meta name="description" content="Portfolio de Rafael Osuna Ventura, técnico superior en ASIR y estudiante de Ingeniería Informática. Software, sistemas y ciberseguridad.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Rafael Osuna Ventura · Portfolio">
    <meta property="og:description" content="Proyectos y trayectoria en software, sistemas y ciberseguridad.">
    <link rel="icon" href="/mark.svg" type="image/svg+xml">
    <title>Rafael Osuna Ventura · Portfolio</title>
    <style>
      .intro {
        position: fixed;
        inset: 0;
        z-index: 100;
        visibility: hidden;
        pointer-events: none;
      }
      html[data-preloading] .intro { visibility: visible; pointer-events: auto; }
      html[data-preloading] .site-header .brand { opacity: 0; }
      .intro-sheet { position: absolute; inset: 0; background: #f8f0de; }
      .intro-brand-slot {
        position: absolute;
        top: 36%;
        inset-inline: 0;
        display: flex;
        justify-content: center;
        transform: translateY(-50%);
      }
      .intro-brand { width: clamp(8rem, 22vmin, 15rem); }
      .intro-brand img { display: block; width: 100%; height: auto; }
      .intro-ring {
        position: absolute;
        top: 73%;
        inset-inline: 0;
        margin-inline: auto;
        width: clamp(3rem, 7vmin, 4.15rem);
        fill: none;
        stroke-width: 2.5;
      }
      .intro-track { stroke: #17447827; }
      .intro-progress {
        stroke: #174478;
        stroke-linecap: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
      }
      html[data-preloading] .intro-brand { animation: intro-arrive .58s cubic-bezier(.22,.68,.23,1) backwards; }
      html[data-preloading] .intro-brand img { animation: intro-inflate .82s cubic-bezier(.2,.7,.25,1) both; }
      html[data-preloading] .intro-ring { animation: intro-arrive .54s .12s cubic-bezier(.22,.68,.23,1) backwards; }
      html[data-preloading] .intro-progress { animation: intro-trace .85s .18s ease-out both; }
      @keyframes intro-arrive {
        from { opacity: 0; translate: 0 min(30vh, 12rem); }
        to { opacity: 1; translate: 0 0; }
      }
      @keyframes intro-trace { to { stroke-dashoffset: 23; } }
      @keyframes intro-inflate {
        from { scale: .82 .62; filter: brightness(.82); }
        68% { scale: 1.05 1.09; filter: brightness(1.04); }
        to { scale: 1; filter: brightness(1); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="intro" aria-hidden="true">
      <div class="intro-sheet"></div>
      <div class="intro-brand-slot">
        <div class="intro-brand"><img src="/logo-inflated.webp" width="600" height="290" alt="ro." fetchpriority="high"></div>
      </div>
      <svg class="intro-ring" viewBox="0 0 48 48" focusable="false">
        <circle class="intro-track" cx="24" cy="24" r="20"></circle>
        <circle class="intro-progress" cx="24" cy="24" r="20" pathLength="100" transform="rotate(-90 24 24)"></circle>
      </svg>
    </div>
    <script>
      if (!location.hash || location.hash === '#inicio') {
        const page = document.documentElement;
        const app = document.getElementById('root');
        const deadline = window.setTimeout(() => document.dispatchEvent(new Event('portfolio:preloaded')), 5200);
        document.addEventListener('portfolio:preloaded', () => {
          window.clearTimeout(deadline);
          page.removeAttribute('data-preloading');
          app.inert = false;
        }, { once: true });
        page.setAttribute('data-preloading', '');
        app.inert = true;
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
